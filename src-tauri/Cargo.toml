[package]
name = "luna-ultra-desktop"
version = "0.2.4"
description = "Luna Ultra desktop companion"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev runs the bare binary, and macOS shows its filename in the Dock;
# cargo forbids spaces in target names, so this is as close as dev can get
[[bin]]
name = "LunaUltra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "macros", "rt"] }

# The auto-updater is a desktop-only concern
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
