name: Feature request
description: Suggest something the app should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The camera has no published API. Describing what you want to *do* is
        more useful than naming a control, because reachability varies wildly.
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do with the camera?
      description: The outcome you're after, not the UI you imagine.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The phone app, the camera's own screen, a workaround, or not at all.
  - type: checkboxes
    id: checked-feature-map
    attributes:
      label: Feature map
      options:
        - label: >
            I checked the feature map and this is not already listed as built,
            gated off, or on hold.
          required: true
