name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Each check runs independently so one failure doesn't mask the others
      # (a failing step would otherwise abort every step after it). The unit
      # tests are further split by project: `bun run test` chains the node
      # and nuxt vitest runs with `&&`, so a node failure would otherwise
      # abort the run before the nuxt project's 12 tests ever get reported.
      - name: Unit tests (node)
        if: ${{ !cancelled() }}
        run: bunx vitest run
      - name: Unit tests (nuxt)
        if: ${{ !cancelled() }}
        run: bunx vitest run -c vitest.nuxt.config.ts
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Rust tests (protocol + mock-server integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
